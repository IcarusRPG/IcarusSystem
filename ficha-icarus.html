<title>Ficha Icarus RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: janela de ficha do Foundry (1280×920) com o chat simulado ao lado em telas largas; empilha em telas estreitas.
   Visual único e escuro, por decisão do prompt (seção 5.2) — não há tema claro. */
:root{
  color-scheme:dark;
  --fundo:#04070b;          /* fora da janela */
  --janela:#070b10;
  --cabecalho:#0a1119;
  --painel:#0c131b;
  --borda:#1c2d3b;
  --borda-forte:#15222e;
  --campo:#080e14;
  --campo-borda:#1f3342;
  --linha:#121e29;
  --btn:#101c27;
  --btn-borda:#2a4558;
  --btn-hover:#17293a;
  --miolo-hex:#0a1620;
  --texto:#e7eef3;
  --branco:#ffffff;
  --apagado:#9bb0be;
  --apagado2:#8aa0b0;
  --apagado3:#6f8696;
  --marcador-vazio:#3a566a;
  --ciano:#3ee0e6;
  --ciano-titulo:#7fd9de;
  --ciano-fundo:#0f2a30;
  --moldura:#2b8f99;
  --ouro:#d8b45a;
  --ouro-claro:#f1d98f;
  --ouro-escuro:#5a4a22;
  --ouro-apagado:#4a3e1f;
  --miolo-escudo:#14110a;
  --pip-vazio:#17303b;
  --pv:#e4574f;
  --pv-fundo:#1a1012;
  --pm:#5b8cff;
  --pm-texto:#6fa0ff;
  --pm-fundo:#0d1426;
  --pm-borda:#2a3f6a;
  --sombra:rgba(2,5,8,.78);
  --f-titulo:'Cinzel','Trajan Pro',Georgia,serif;
  --f-corpo:'Alegreya Sans','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--fundo)}
body{color:var(--texto);font-family:var(--f-corpo);font-size:16px;line-height:1.35}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--ciano);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cz{font-family:var(--f-titulo)}
.num{font-variant-numeric:tabular-nums}

.pagina{padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.intro,.palco{width:100%;max-width:1280px}
@media (min-width:1660px){.intro,.palco{max-width:1620px}.palco{display:grid;grid-template-columns:1280px minmax(0,1fr);gap:20px;align-items:start}}
.palco{display:flex;flex-direction:column;gap:16px}
@media (min-width:1660px){.palco{display:grid}}

/* Faixa de apresentação do protótipo */
.intro{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.intro h1{margin:0;font-family:var(--f-titulo);font-size:20px;letter-spacing:.12em;font-weight:700;color:var(--texto)}
.intro p{margin:4px 0 0;color:var(--apagado);font-size:15px;max-width:70ch}
.intro-acoes{display:flex;gap:8px;flex-wrap:wrap}
.testes{width:100%;max-width:1280px;background:var(--painel);border:1px solid var(--borda);border-radius:6px;padding:12px 16px}
@media (min-width:1660px){.testes{max-width:1620px}}
.testes ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 20px}
.testes li{display:flex;gap:8px;align-items:baseline;font-size:15px}
.ok{color:var(--ciano);font-weight:700}
.falha{color:var(--pv);font-weight:700}

/* Botões e campos */
.btn{border:1px solid var(--btn-borda);background:var(--btn);color:var(--texto);border-radius:4px;font-size:15px;line-height:1;padding:0 12px;height:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--btn-hover);border-color:var(--ciano)}
.btn.quad{width:32px;padding:0}
.btn.peq{height:28px;font-size:14px;padding:0 10px}
.btn.icone{width:30px;height:30px;padding:0;background:none;border-color:transparent;color:var(--apagado2)}
.btn.icone:hover{border-color:var(--btn-borda);color:var(--ciano)}
.btn.tracejado{border-style:dashed;color:var(--apagado);background:none}
.btn.tracejado:hover{color:var(--texto)}
.btn.primario{border-color:var(--moldura);background:var(--ciano-fundo);color:var(--ciano)}
.btn.ativo{border-color:var(--ciano);color:var(--ciano);background:var(--ciano-fundo)}
.campo{background:var(--campo);border:1px solid var(--campo-borda);border-radius:4px;color:var(--texto);font-size:15px;padding:6px 10px;width:100%}
.campo:hover{border-color:var(--btn-borda)}
select.campo option,select option{background:var(--painel);color:var(--texto)}
input[type=number].sem-seta{-moz-appearance:textfield;appearance:textfield}
input[type=number].sem-seta::-webkit-inner-spin-button,input[type=number].sem-seta::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea.campo{resize:vertical;line-height:1.5}
.rot{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ciano-titulo)}
.titulo-painel{font-family:var(--f-titulo);font-size:13px;letter-spacing:.18em;color:var(--ciano-titulo);font-weight:700;margin:0}
.painel{background:var(--painel);border:1px solid var(--borda);border-radius:6px}
.dica{font-size:13px;color:var(--apagado2)}

/* Janela */
.ficha{position:relative;background:var(--janela);border:1px solid var(--borda);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;height:920px;min-width:0}
.janela-barra{height:34px;flex:none;background:var(--fundo);border-bottom:1px solid var(--borda-forte);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.janela-barra .cz{font-size:13px;letter-spacing:.14em;color:var(--apagado);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.janela-barra nav{display:flex;gap:18px;font-size:14px;color:var(--apagado)}

/* Formas */
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.escudo-forma{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}

/* Cabeçalho */
.cab{flex:none;display:flex;gap:26px;padding:18px 28px 14px;background:var(--cabecalho);border-bottom:1px solid var(--borda-forte);align-items:center}
.retrato{width:122px;height:136px;flex:none;position:relative;background:none;border:0;padding:0}
.retrato .moldura{position:absolute;inset:0;background:var(--moldura);transition:background .15s}
.retrato:hover .moldura{background:var(--ciano)}
.retrato .miolo{position:absolute;inset:3px;background:var(--miolo-hex);display:flex;align-items:center;justify-content:center;overflow:hidden}
.retrato img{width:92px;height:92px;object-fit:contain}
.retrato img.foto{width:100%;height:100%;object-fit:cover}
.cab-meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.nome{background:none;border:0;border-bottom:1px solid #24404f;color:var(--branco);font-family:var(--f-titulo);font-size:36px;font-weight:700;letter-spacing:.04em;padding:0 0 6px;width:100%;border-radius:0}
.nome:hover{border-bottom-color:var(--moldura)}
.identidade{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.identidade label{display:flex;flex-direction:column;gap:4px;min-width:0}
.nivel{width:258px;flex:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.nivel-linha{display:flex;align-items:center;gap:14px}
.nivel-num{font-size:44px;font-weight:700;line-height:1;color:var(--branco);text-align:center;min-width:64px}
.nivel-rot{font-size:12px;letter-spacing:.2em;color:var(--apagado);text-align:center}
.pips{display:flex;gap:2px}
.pip{width:7px;height:14px;border-radius:1px;background:var(--pip-vazio)}
.pip.on{background:var(--ciano)}
.pip.par{background:var(--ouro-apagado)}
.pip.par.on{background:var(--ouro)}
.paragon{font-family:var(--f-titulo);font-size:13px;letter-spacing:.3em;color:var(--ouro);font-weight:700}
.paragon-dica{font-size:13px;color:var(--apagado2)}

/* Recursos */
.recursos{flex:none;display:grid;grid-template-columns:1fr 1fr 330px;gap:16px;padding:14px 28px}
.recurso{padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.recurso .rot-rec{font-family:var(--f-titulo);font-size:12px;letter-spacing:.2em;font-weight:700;text-align:center}
.recurso.pv .rot-rec{color:var(--pv)}
.recurso.pm .rot-rec{color:var(--pm-texto)}
.recurso-linha{display:flex;align-items:center;justify-content:center;gap:12px}
.recurso-valor{display:flex;align-items:baseline;gap:6px;font-family:var(--f-titulo);font-size:30px;font-weight:700}
.recurso-valor input{width:72px;background:none;border:1px solid transparent;border-radius:4px;color:var(--texto);font:inherit;text-align:right;padding:0 4px}
.recurso-valor input:hover{border-color:var(--campo-borda)}
.recurso-valor .max{color:var(--apagado3);font-weight:500}
.barra{height:8px;border-radius:4px;overflow:hidden}
.barra span{display:block;height:100%;transition:width .2s}
.pv .barra{background:var(--pv-fundo)} .pv .barra span{background:var(--pv)}
.pm .barra{background:var(--pm-fundo)} .pm .barra span{background:var(--pm)}
.defesa{padding:10px 16px;display:flex;align-items:center;gap:16px}
.escudo{width:64px;height:72px;flex:none;position:relative}
.escudo .moldura{position:absolute;inset:0;background:var(--ouro)}
.escudo .miolo{position:absolute;inset:3px;background:var(--miolo-escudo);display:flex;justify-content:center;padding-top:10px}
.escudo .miolo span{font-family:var(--f-titulo);font-size:26px;font-weight:700;color:var(--ouro-claro)}
.defesa-info{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:14px;color:var(--apagado)}
.defesa-info .rot-def{font-family:var(--f-titulo);font-size:12px;letter-spacing:.2em;color:var(--ouro);font-weight:700}
.defesa-info b{color:var(--texto)}
.outros-def{display:inline-flex;align-items:center;gap:6px}
.outros-def input{width:44px;padding:1px 4px;font-size:14px;text-align:center}

/* Abas */
.abas{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 28px;border-bottom:1px solid var(--borda);min-height:46px}
.abas-lista{display:flex;gap:6px;align-self:stretch;overflow-x:auto}
.aba{background:none;border:0;padding:0 22px;color:var(--apagado);font-family:var(--f-titulo);font-size:15px;letter-spacing:.1em;position:relative;white-space:nowrap}
.aba:hover{color:var(--branco)}
.aba[aria-selected="true"]{color:var(--ciano);font-weight:700}
.aba[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--ciano);border-radius:2px 2px 0 0}
.abas .btn{margin-bottom:7px;flex:none}

/* Corpo */
.corpo{flex:1;min-height:0;padding:18px 28px;overflow:auto}
.corpo::-webkit-scrollbar,.chat-log::-webkit-scrollbar{width:8px}
.corpo::-webkit-scrollbar-thumb,.chat-log::-webkit-scrollbar-thumb{background:#24404f;border-radius:4px}

/* Características */
.carac{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:16px;align-items:start}
.atributos{display:flex;flex-direction:column;gap:6px}
.atr{display:flex;align-items:center;gap:12px;padding:6px 10px;height:76px}
.atr-hex{width:54px;height:60px;flex:none;position:relative}
.atr-hex .moldura{position:absolute;inset:0;background:var(--moldura)}
.atr-hex .miolo{position:absolute;inset:2px;background:var(--miolo-hex);display:flex;align-items:center;justify-content:center}
.atr-hex span{font-family:var(--f-titulo);font-size:22px;font-weight:700;color:var(--branco)}
.atr-corpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.atr-nome{display:flex;align-items:baseline;gap:8px;min-width:0}
.atr-nome .sigla{font-family:var(--f-titulo);font-size:18px;font-weight:700;color:var(--ciano-titulo);letter-spacing:.06em}
.atr-nome .extenso{font-size:13px;color:var(--apagado2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr-campos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.atr-campos label{display:flex;flex-direction:column;gap:1px}
.atr-campos span{font-size:10px;letter-spacing:.1em;color:var(--apagado2)}
.atr-campos .r span{color:var(--ciano-titulo)}
.atr-campos .t span{color:var(--ouro)}
.atr-campos input{padding:2px 4px;font-size:14px;text-align:center}

.pericias{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.lista-per{padding:6px 8px}
.per-linha{display:grid;grid-template-columns:20px minmax(0,1fr) 40px 36px 46px;gap:6px;align-items:center;height:29px;padding:0 4px;border-bottom:1px solid var(--linha)}
.per-linha:last-child{border-bottom:0}
.per-cab{height:24px;font-size:11px;letter-spacing:.12em;color:var(--ciano-titulo);border-bottom:1px solid var(--borda)}
.per-cab span:nth-child(n+3){text-align:center}
.marcador{width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;border-radius:50%}
.m0{width:14px;height:14px;border-radius:50%;border:2px solid var(--marcador-vazio);display:block}
.m1{width:14px;height:14px;border-radius:50%;border:2px solid var(--ciano);background:var(--ciano);display:block}
.m2{width:10px;height:10px;transform:rotate(45deg);background:var(--ouro);box-shadow:0 0 0 2px var(--painel),0 0 0 3px var(--ouro);display:block}
.marcador:hover .m0{border-color:var(--ciano-titulo)}
.per-nome{display:flex;align-items:center;gap:5px;min-width:0}
.per-nome span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--apagado)}
.per-nome.treinada span:first-child{color:var(--branco)}
.res{font-size:9px;letter-spacing:.08em;color:var(--ouro);border:1px solid var(--ouro-escuro);padding:0 3px;border-radius:2px;flex:none}
.sel-atr{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid transparent;color:var(--apagado2);font-size:12px;text-align:center;text-align-last:center;width:40px;padding:2px 0;border-radius:3px}
.sel-atr:hover{border-color:var(--campo-borda);color:var(--texto)}
.sel-atr.mudou{color:var(--ciano-titulo)}
.per-outros{padding:1px 2px;font-size:13px;text-align:center;height:22px}
.per-outros.zero{color:var(--apagado3)}
.total{min-width:46px;height:24px;font-weight:700;font-size:15px;padding:0 4px}

.lateral{display:flex;flex-direction:column;gap:12px}
.lat{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.lat-linha{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lat-linha > span{color:var(--apagado2);flex:none}
.lat-linha .campo{max-width:160px;padding:4px 8px}
.desloc{display:flex;align-items:center;gap:6px}
.desloc input{width:60px;padding:4px 6px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-res{height:28px;padding:0 8px;font-size:13px}
.chip-res b{font-size:14px}
.lat textarea{min-height:120px}

/* Inventário */
.inv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.lista{padding:12px 16px;display:flex;flex-direction:column}
.lista-cab{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px}
.item{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--linha)}
.item-nome{flex:1;min-width:0}
.item-nome b{font-weight:500;display:block}
.item-nome small{font-size:13px;color:var(--apagado2)}
.item-qtd{color:var(--apagado2);width:44px;text-align:right}
.equipar{width:104px;height:30px;font-size:14px}
.equipar.on{color:var(--ciano)}
.equipar-vazio{width:104px}
.acoes{display:flex;gap:2px}
.vazio{padding:14px 6px;color:var(--apagado2);font-size:14px}
.add{margin-top:12px;height:36px;width:100%}
.lado{display:flex;flex-direction:column;gap:12px}
.caixa-def{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.caixa-def .titulo-painel{color:var(--ouro)}
.caixa-def .grande{font-family:var(--f-titulo);font-size:34px;font-weight:700;color:var(--ouro-claro)}
.reservado{border:1px dashed var(--btn-borda);border-radius:6px;padding:12px 16px;color:var(--apagado2);font-size:14px}

/* Poderes */
.poderes{display:flex;flex-direction:column;gap:18px}
.grupo-cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.losango{width:8px;height:8px;transform:rotate(45deg);background:var(--ouro);flex:none}
.grupo-cab h3{margin:0;font-family:var(--f-titulo);font-size:14px;letter-spacing:.16em;font-weight:700;color:var(--texto);white-space:nowrap}
.grupo-cab .fio{flex:1;height:1px;background:#1f3a4a;min-width:20px}
.grupo-cab .tag{font-size:13px;color:var(--apagado2);white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card-topo{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card-topo b{color:var(--ciano-titulo)}
.custo{font-size:12px;color:var(--pm-texto);border:1px solid var(--pm-borda);border-radius:3px;padding:1px 6px;white-space:nowrap}
.card-texto{font-size:14px;color:#a9bcc9;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;color:var(--apagado2)}
.card-acoes{display:flex;justify-content:flex-end;gap:2px;margin-top:auto}
.card-vazio{border:1px dashed var(--btn-borda);border-radius:6px;padding:12px 14px;color:var(--apagado2);font-size:14px;grid-column:1/-1}

/* Diário */
.diario{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch;min-height:100%}
.diario .painel{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.diario textarea{flex:1;min-height:360px;font-size:16px}

/* Efeitos */
.efeitos{padding:12px 16px;display:flex;flex-direction:column}
.efeito-mods{font-size:13px;color:var(--ciano-titulo)}
.estado{width:96px;height:30px;font-size:14px}
.estado.on{color:var(--ciano)}

/* Rodapé */
.rodape{flex:none;min-height:42px;background:var(--fundo);border-top:1px solid var(--borda-forte);display:flex;align-items:center;justify-content:space-between;gap:8px 20px;padding:6px 28px;flex-wrap:wrap}
.rodape .ult{display:flex;align-items:center;gap:12px;min-width:0}
.rodape .ult b{font-size:17px}
.crit{color:var(--ouro-claro)}
.fumble{color:var(--pv)}

/* Chat simulado */
.chat{display:flex;flex-direction:column;gap:10px;min-width:0}
.chat-cab{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;padding-right:4px}
.cartao{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cartao.crit{border-color:var(--ouro)}
.cartao.fumble{border-color:var(--pv)}
.cartao-topo{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--apagado2)}
.cartao h4{margin:0;font-family:var(--f-titulo);font-size:16px;letter-spacing:.08em;color:var(--texto)}
.cartao-dados{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--apagado)}
.d20{width:34px;height:38px;position:relative;flex:none}
.d20 .moldura{position:absolute;inset:0;background:var(--moldura)}
.d20 .miolo{position:absolute;inset:2px;background:var(--miolo-hex);display:flex;align-items:center;justify-content:center;font-family:var(--f-titulo);font-weight:700;font-size:15px;color:var(--branco)}
.cartao.crit .d20 .moldura{background:var(--ouro)}
.cartao.fumble .d20 .moldura{background:var(--pv)}
.resultado{margin-left:auto;font-family:var(--f-titulo);font-size:26px;font-weight:700;color:var(--branco)}
.cartao.crit .resultado,.cartao.crit .selo{color:var(--ouro-claro)}
.cartao.fumble .resultado,.cartao.fumble .selo{color:var(--pv)}
.selo{font-family:var(--f-titulo);font-size:12px;letter-spacing:.2em;font-weight:700}

/* Diálogos */
.sombra{position:fixed;inset:0;background:var(--sombra);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--painel);border:1px solid var(--moldura);border-radius:8px;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.dlg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-cab h2{margin:0;font-family:var(--f-titulo);font-size:18px;font-weight:700;letter-spacing:.1em}
.dlg-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dlg label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.dlg label.f.largo{grid-column:1/-1}
.passo{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--campo);border:1px solid var(--campo-borda);border-radius:6px;padding:8px 12px}
.passo span{color:#a9bcc9}
.passo-ctl{display:flex;align-items:center;gap:10px}
.passo-ctl b{min-width:28px;text-align:center;font-size:18px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ciano)}
.dlg-totais{display:flex;flex-wrap:wrap;gap:8px 24px;padding-top:10px;border-top:1px solid var(--borda)}
.dlg-totais b{font-family:var(--f-titulo);font-size:18px}
.dlg-rodape{display:flex;justify-content:flex-end;gap:8px}
.mudanca{display:grid;grid-template-columns:minmax(0,1fr) 80px 30px;gap:8px;align-items:center}

/* Responsivo (5.5) */
@media (max-width:1180px){
  .carac{grid-template-columns:250px minmax(0,1fr)}
  .lateral{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1100px){.identidade{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .ficha{height:auto}
  .corpo{overflow:visible}
  .cab{flex-wrap:wrap;padding:16px;gap:16px}
  .retrato{order:1}
  .nivel{order:2;margin-left:auto;width:auto}
  .cab-meio{order:3;flex-basis:100%}
  .recursos{grid-template-columns:1fr 1fr;padding:14px 16px}
  .recursos .defesa{grid-column:1/-1}
  .abas,.corpo{padding-left:16px;padding-right:16px}
  .rodape{padding:8px 16px}
  .carac{grid-template-columns:minmax(0,1fr)}
  .atributos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .pericias{grid-template-columns:minmax(0,1fr)}
  .inv,.diario{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .identidade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nome{font-size:28px}
  .recursos{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .dlg-grade{grid-template-columns:1fr}
  .janela-barra nav{display:none}
  .retrato{width:96px;height:108px}
  .retrato img{width:70px;height:70px}
  .item{flex-wrap:wrap}
  .item-nome{flex-basis:calc(100% - 60px)}
}

/* ---------- Cálculos derivados (equivale ao prepareDerivedData) ---------- */
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmt = n => (n >= 0 ? "+" : "−") + Math.abs(n);
const sgn = n => (n < 0 ? "−" + Math.abs(n) : String(n));

function somarEfeito(obj, key, v){
  const partes = key.replace(/^system\./,"").split(".");
  let o = obj;
  for (let i = 0; i < partes.length - 1; i++){ o = o ? o[partes[i]] : null; if (!o) return; }
  const ult = partes[partes.length-1];
  if (ult in o) o[ult] = num(o[ult]) + v;
}

function derivar(fonte){
  const s = structuredClone(fonte);
  // ActiveEffects ligados, modo ADD, aplicados antes dos derivados (como no Foundry)
  for (const ef of s.efeitos) if (!ef.disabled) for (const c of ef.changes) somarEfeito(s, c.key, num(c.value));
  // Total do atributo = Base + Raça + Temp
  const A = {};
  for (const k of ATR){ const a = s.atributos[k] || {}; A[k] = num(a.base) + num(a.racial) + num(a.temp); }
  const n = clamp(Math.trunc(num(s.nivel)) || 1, 1, 25);
  const cc = s.classeConfig;
  // PV máx = PV inicial + PV por nível × (nível − 1) + Atributo do PV × nível
  const pvForm = num(cc.pvInicial) + num(cc.pvPorNivel) * (n-1) + (ATR.includes(cc.pvAtributo) ? A[cc.pvAtributo] * n : 0);
  // PM máx = PM inicial + PM por nível × (nível − 1) + Atributo-chave × nível (só conjuradoras)
  const pmForm = num(cc.pmInicial) + num(cc.pmPorNivel) * (n-1) + (ATR.includes(cc.pmAtributo) ? A[cc.pmAtributo] * n : 0);
  const pvMax = Math.max(0, (cc.manual ? num(s.pv.max) : pvForm) + num(cc.bonusPv));
  const pmMax = Math.max(0, (cc.manual ? num(s.pm.max) : pmForm) + num(cc.bonusPm));
  // Defesa = 10 + DES + Armadura + Escudo + Outros (armadura/escudo vêm dos itens equipados)
  let arm = 0, esc = 0;
  for (const it of s.itens) if (it.type === "equipamento" && it.system.equipado){
    if (it.system.tipo === "armadura") arm += num(it.system.bonusDefesa);
    else if (it.system.tipo === "escudo") esc += num(it.system.bonusDefesa);
  }
  const defOutros = num(s.defesa.outros);
  // Perícia = Atributo + Bônus de treino + Outros
  const per = {};
  for (const p of PERICIAS){
    const d = s.pericias[p.k] || {};
    const t = [0,1,2].includes(d.treino) ? d.treino : 0;
    const atr = ATR.includes(d.atributo) ? d.atributo : p.a;
    per[p.k] = {treino:t, atributo:atr, outros:num(d.outros), total:A[atr] + TREINO[t] + num(d.outros)};
  }
  const m = num(s.deslocamento);
  return {
    A, n, pvForm, pmForm, pvMax, pmMax,
    pv: clamp(num(fonte.pv.value), 0, pvMax), pm: clamp(num(fonte.pm.value), 0, pmMax),
    arm, esc, defOutros, def: 10 + A.DES + arm + esc + defOutros,
    per, desloc:m, quad:Math.floor(m / 1.5), paragon:n >= 21
  };
}

function vRecursos(D){
  const rec = (k, rot, val, max, pct, menos, mais) => `<div class="painel recurso ${k}">
      <div class="rot-rec">${rot}</div>
      <div class="recurso-linha">
        <button class="btn quad" id="b-${k}-menos" data-action="recurso" data-rec="${k}" data-delta="-1" aria-label="${menos}">−</button>
        <div class="recurso-valor num"><input id="f-${k}" type="number" class="sem-seta" data-field="${k}.value" data-type="number" value="${val}" aria-label="${rot} atuais"><span class="max">/ ${max}</span></div>
        <button class="btn quad" id="b-${k}-mais" data-action="recurso" data-rec="${k}" data-delta="1" aria-label="${mais}">+</button>
      </div>
      <div class="barra"><span style="width:${pct}%"></span></div>
    </div>`;
  const pct = (v,m) => (m > 0 ? Math.round(100 * v / m) : 0);
  return `<div class="recursos">
    ${rec("pv","PONTOS DE VIDA",D.pv,D.pvMax,pct(D.pv,D.pvMax),"Perder 1 PV","Recuperar 1 PV")}
    ${rec("pm","PONTOS DE MANA",D.pm,D.pmMax,pct(D.pm,D.pmMax),"Gastar 1 PM","Recuperar 1 PM")}
    <div class="painel defesa">
      <div class="escudo" aria-hidden="true"><span class="moldura escudo-forma"></span><span class="miolo escudo-forma"><span class="num">${D.def}</span></span></div>
      <div class="defesa-info">
        <span class="rot-def">DEFESA ${D.def}</span>
        <span class="num">${formulaDef(D)}</span>
        <span class="outros-def"><label for="f-def-outros">Outros</label><input id="f-def-outros" type="number" class="campo sem-seta" data-field="defesa.outros" data-type="number" value="${num(S.defesa.outros)}"></span>
        <span>Deslocamento <b class="num">${sgn(D.desloc)} m (${D.quad}q)</b></span>
      </div>
    </div>
  </div>`;
}
const formulaDef = D => `10 + DES ${sgn(D.A.DES)} + Armadura ${sgn(D.arm)} + Escudo ${sgn(D.esc)} + Outros ${sgn(D.defOutros)}`;

    </div>
    <div class="lateral">
      <div class="painel lat">
        <p class="titulo-painel">OUTRAS CARACTERÍSTICAS</p>
        <div class="lat-linha"><label for="f-tamanho">Tamanho</label>
          <select id="f-tamanho" class="campo" data-field="tamanho">${Object.entries(TAMANHOS).map(([k,t]) => `<option value="${k}"${k === S.tamanho ? " selected" : ""}>${t.nome}</option>`).join("")}</select></div>
        <div class="lat-linha"><label for="f-desloc">Deslocamento</label>
          <span class="desloc"><input id="f-desloc" type="number" step="1.5" class="campo sem-seta num" data-field="deslocamento" data-type="float" value="${num(S.deslocamento)}"><span>m (${D.quad}q)</span></span></div>
        ${tam && tam.desloc != null && tam.desloc !== D.desloc ? `<div class="dica">Padrão do tamanho ${tam.nome}: ${tam.desloc} m. Raças e poderes podem alterar.</div>` : ""}
        <div class="lat-linha"><span>Resistências</span>
          <div class="chips">${RESIST.map(([k,ab]) => `<button class="btn chip-res num" id="b-res-${k}" data-action="rolar" data-k="${k}" title="Rolar ${PER[k].nome}">${ab} <b>${fmt(D.per[k].total)}</b></button>`).join("")}</div></div>
        <div class="lat-linha"><label for="f-imun">Imunidades</label><input id="f-imun" class="campo" data-field="imunidades" value="${esc(S.imunidades)}" placeholder="—"></div>
        <div class="lat-linha"><label for="f-sent">Sentidos</label><input id="f-sent" class="campo" data-field="sentidos" value="${esc(S.sentidos)}" placeholder="—"></div>
      </div>
      <div class="painel lat">
        <p class="titulo-painel">PROFICIÊNCIAS</p>
        <div class="lat-linha"><label for="f-armas">Armas</label><input id="f-armas" class="campo" data-field="proficiencias.armas" value="${esc(S.proficiencias.armas)}"></div>
        <div class="lat-linha"><label for="f-armaduras">Armaduras</label><input id="f-armaduras" class="campo" data-field="proficiencias.armaduras" value="${esc(S.proficiencias.armaduras)}"></div>

      <div class="painel lat">
        <label for="f-notas" class="titulo-painel">NOTAS</label>

function vPoderes(D){
  const poderes = S.itens.filter(i => i.type === "poder");
  const sub = {raca:S.identidade.raca, classe:S.identidade.classe, origem:S.identidade.origem, profissao:S.identidade.profissao, geral:""};
  return `<div class="poderes">${Object.entries(FONTES).map(([f,nome]) => {
    const lista = poderes.filter(p => p.system.fonte === f);
    const titulo = (f === "geral" ? "PODERES GERAIS" : nome.toUpperCase() + (sub[f] ? " — " + sub[f].toUpperCase() : ""));
    const tag = f === "classe" ? "Nível " + D.n : lista.length + (lista.length === 1 ? " poder" : " poderes");
    return `<section aria-label="${esc(titulo)}">
      <div class="grupo-cab"><span class="losango"></span><h3>${esc(titulo)}</h3><span class="fio"></span><span class="tag">${tag}</span>
        <button class="btn peq tracejado" id="b-novo-poder-${f}" data-action="novo-poder" data-fonte="${f}">+ Adicionar poder</button></div>
      <div class="cards">${lista.map(p => {
        const s = p.system, temCusto = s.custoPM !== "" && s.custoPM != null;
        const meta = [s.nivel ? s.nivel + "º nível" : "", s.prerequisito ? "Pré-requisito: " + s.prerequisito : ""].filter(Boolean).join(" · ");
        return `<article class="painel card">
          <div class="card-topo"><b>${esc(p.name)}</b>${temCusto ? `<span class="custo">${num(s.custoPM)} PM</span>` : ""}</div>
          ${meta ? `<div class="card-meta">${esc(meta)}</div>` : ""}
          <div class="card-texto">${esc(s.descricao)}</div>
          <div class="card-acoes">
            <button class="btn icone" id="b-ed-${p.id}" data-action="editar-item" data-id="${p.id}" aria-label="Editar ${esc(p.name)}">${ICO.editar}</button>
            <button class="btn icone" id="b-ex-${p.id}" data-action="excluir-item" data-id="${p.id}" aria-label="Excluir ${esc(p.name)}">${ICO.excluir}</button>
          </div>
        </article>`;
      }).join("") || `<div class="card-vazio">Nenhum poder de ${nome.toLowerCase()} ainda.</div>`}</div>
    </section>`;
  }).join("")}</div>`;
}

    ${linhas || `<div class="vazio">Nenhum efeito.</div>`}

function textoRolagem(r){ return `${r.rotulo} · d20 ${r.d} ${fmt(r.mod)} = ${r.total}`; }

function vRodape(){

    <div class="ult"><span class="cz dica" style="letter-spacing:.16em;font-size:12px">ROLAGEM</span>${ult}</div>

  </footer>`;
}

function vChat(D){
  const cartoes = ui.chat.map((r,i) => {
    const cls = r.d === 20 ? " crit" : r.d === 1 ? " fumble" : "";

/* ---------- Diálogos ---------- */
function vModal(){
  const m = ui.modal; if (!m) return "";
  let corpo = "";
  if (m.tipo === "nivel") corpo = vDlgNivel(m.d);

  else if (m.tipo === "efeito") corpo = vDlgEfeito(m.d);
  return `<div class="sombra" data-action="fundo-modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-titulo">${corpo}</div></div>`;
}
function cabDlg(t){ return `<div class="dlg-cab"><h2 id="dlg-titulo">${t}</h2><button class="btn icone" id="b-dlg-fechar" data-action="fechar-modal" aria-label="Fechar">${ICO.fechar}</button></div>`; }
function rodDlg(){ return `<div class="dlg-rodape"><button class="btn" id="b-dlg-cancelar" data-action="fechar-modal">Cancelar</button><button class="btn primario" id="b-dlg-salvar" data-action="salvar-modal">Salvar</button></div>`; }

function vDlgNivel(d){
  const prev = derivar({...S, classeConfig:d.cc, pv:{...S.pv,max:d.pvMax}, pm:{...S.pm,max:d.pmMax}});
  const passo = (campo, rot) => `<div class="passo"><span>${rot}</span><div class="passo-ctl">
      <button class="btn quad" id="b-p-${campo}-m" data-action="passo" data-campo="${campo}" data-delta="-1" aria-label="Diminuir ${rot}">−</button>
      <b class="cz num">${num(d.cc[campo])}</b>
      <button class="btn quad" id="b-p-${campo}-p" data-action="passo" data-campo="${campo}" data-delta="1" aria-label="Aumentar ${rot}">+</button></div></div>`;
  const chips = (campo, opcoes) => `<div class="chips">${opcoes.map(k => `<button class="btn peq${d.cc[campo] === k ? " ativo" : ""}" id="b-chip-${campo}-${k || "nenhum"}" data-action="chip" data-campo="${campo}" data-valor="${k || ""}" aria-pressed="${d.cc[campo] === k}">${k || "Nenhum"}</button>`).join("")}</div>`;
  return `${cabDlg("CONFIGURAÇÃO DE NÍVEL")}
    <div class="dica" style="font-size:14px">Classe: <b style="color:var(--texto)">${esc(S.identidade.classe || "—")}</b> · PV = inicial + por nível × (nível − 1) + atributo × nível. PM igual; classes não conjuradoras não somam atributo.</div>
    <div class="dlg-grade">${passo("pvInicial","PV inicial")}${passo("pvPorNivel","PV por nível")}${passo("pmInicial","PM inicial")}${passo("pmPorNivel","PM por nível")}</div>
    <div class="dlg-grade">
      <label class="f" for="d-bonusPv"><span class="rot">Bônus de PV</span><input id="d-bonusPv" type="number" class="campo" data-draft="cc.bonusPv" data-type="number" value="${num(d.cc.bonusPv)}"></label>
      <label class="f" for="d-bonusPm"><span class="rot">Bônus de PM</span><input id="d-bonusPm" type="number" class="campo" data-draft="cc.bonusPm" data-type="number" value="${num(d.cc.bonusPm)}"></label>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="rot">Atributo do PV</span>${chips("pvAtributo",[null,...ATR])}
      <span class="rot" style="margin-top:4px">Atributo-chave do PM (só classes conjuradoras)</span>${chips("pmAtributo",[null,"INT","SAB","CAR"])}
    </div>
    <label class="chk" for="d-manual"><input id="d-manual" type="checkbox" data-draft="cc.manual" data-type="bool"${d.cc.manual ? " checked" : ""}> Manual: digitar PV e PM máximos e ignorar a fórmula</label>
    ${d.cc.manual ? `<div class="dlg-grade">
      <label class="f" for="d-pvMax"><span class="rot">PV máximo</span><input id="d-pvMax" type="number" class="campo" data-draft="pvMax" data-type="number" value="${num(d.pvMax)}"></label>
      <label class="f" for="d-pmMax"><span class="rot">PM máximo</span><input id="d-pmMax" type="number" class="campo" data-draft="pmMax" data-type="number" value="${num(d.pmMax)}"></label>
    </div>` : ""}
    <div class="dlg-totais">
      <div>PV total no nível ${prev.n}: <b style="color:var(--pv)" class="num">${prev.pvMax}</b></div>
      <div>PM total no nível ${prev.n}: <b style="color:var(--pm-texto)" class="num">${prev.pmMax}</b></div>
    </div>
    ${rodDlg()}`;
}

function vDlgItem(d){
  const s = d.system;
  if (d.type === "poder") return `${cabDlg(d.id ? "EDITAR PODER" : "NOVO PODER")}
    <div class="dlg-grade">
      <label class="f largo" for="d-nome"><span class="rot">Nome</span><input id="d-nome" class="campo" data-draft="name" value="${esc(d.name)}"></label>
      <label class="f" for="d-fonte"><span class="rot">Fonte</span><select id="d-fonte" class="campo" data-draft="system.fonte">${Object.entries(FONTES).map(([k,l]) => `<option value="${k}"${k === s.fonte ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f" for="d-custo"><span class="rot">Custo em PM (vazio = sem custo)</span><input id="d-custo" type="number" class="campo" data-draft="system.custoPM" data-type="vazio" value="${esc(s.custoPM)}"></label>
      <label class="f" for="d-pnivel"><span class="rot">Nível (opcional)</span><input id="d-pnivel" type="number" class="campo" data-draft="system.nivel" data-type="vazio" value="${esc(s.nivel ?? "")}"></label>
      <label class="f" for="d-prereq"><span class="rot">Pré-requisito</span><input id="d-prereq" class="campo" data-draft="system.prerequisito" value="${esc(s.prerequisito)}"></label>
      <label class="f largo" for="d-desc"><span class="rot">Descrição</span><textarea id="d-desc" class="campo" rows="5" data-draft="system.descricao">${esc(s.descricao)}</textarea></label>
    </div>${rodDlg()}`;
  const podeEquipar = s.tipo === "armadura" || s.tipo === "escudo";
  return `${cabDlg(d.id ? "EDITAR ITEM" : "NOVO ITEM")}
    <div class="dlg-grade">
      <label class="f largo" for="d-nome"><span class="rot">Nome</span><input id="d-nome" class="campo" data-draft="name" value="${esc(d.name)}"></label>
      <label class="f" for="d-tipo"><span class="rot">Tipo</span><select id="d-tipo" class="campo" data-draft="system.tipo">${Object.entries(TIPOS_EQUIP).map(([k,l]) => `<option value="${k}"${k === s.tipo ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f" for="d-qtd"><span class="rot">Quantidade</span><input id="d-qtd" type="number" class="campo" data-draft="system.quantidade" data-type="number" value="${num(s.quantidade)}"></label>
      ${podeEquipar ? `<label class="f" for="d-bdef"><span class="rot">Bônus de Defesa</span><input id="d-bdef" type="number" class="campo" data-draft="system.bonusDefesa" data-type="number" value="${num(s.bonusDefesa)}"></label>
      <label class="chk" for="d-equip" style="align-self:end;height:36px"><input id="d-equip" type="checkbox" data-draft="system.equipado" data-type="bool"${s.equipado ? " checked" : ""}> Equipado</label>` : ""}
      <label class="f largo" for="d-desc"><span class="rot">Descrição</span><textarea id="d-desc" class="campo" rows="4" data-draft="system.descricao">${esc(s.descricao)}</textarea></label>
    </div>${rodDlg()}`;
}

function vDlgEfeito(d){
  return `${cabDlg(d.id ? "EDITAR EFEITO" : "NOVO EFEITO")}
    <div class="dlg-grade">
      <label class="f largo" for="d-nome"><span class="rot">Nome</span><input id="d-nome" class="campo" data-draft="name" value="${esc(d.name)}"></label>
      <label class="f largo" for="d-desc"><span class="rot">Descrição</span><input id="d-desc" class="campo" data-draft="descricao" value="${esc(d.descricao)}"></label>
    </div>
    <label class="chk" for="d-ativo"><input id="d-ativo" type="checkbox" data-draft="ativo" data-type="bool"${d.ativo ? " checked" : ""}> Efeito ativo</label>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="rot">Alterações · modo Somar (ADD)</span>
      ${d.changes.map((c,i) => `<div class="mudanca">
        <select id="d-alvo-${i}" class="campo" data-draft="changes.${i}.key" aria-label="Campo alterado">${ALVOS_EFEITO.map(([k,l]) => `<option value="${k}"${k === c.key ? " selected" : ""}>${l}</option>`).join("")}</select>
        <input id="d-valor-${i}" type="number" class="campo" data-draft="changes.${i}.value" data-type="number" value="${num(c.value)}" aria-label="Valor somado">
        <button class="btn icone" id="b-rm-mud-${i}" data-action="remover-mudanca" data-i="${i}" aria-label="Remover alteração">${ICO.excluir}</button>
      </div>`).join("") || `<div class="dica">Sem alterações: o efeito fica só como lembrete.</div>`}
      <button class="btn tracejado peq" id="b-add-mud" data-action="add-mudanca" style="align-self:flex-start">+ Alteração</button>
    </div>
    ${rodDlg()}`;
}

/* ---------- Render ---------- */
const app = document.getElementById("app");
function render(){
  const D = derivar(S);
  let corpo = "";
  if (ui.aba === "carac") corpo = vCarac(D);
  else if (ui.aba === "inv") corpo = vInventario(D);
  else if (ui.aba === "pod") corpo = vPoderes(D);
  else if (ui.aba === "dia") corpo = vDiario();
  else corpo = vEfeitos();
  const html = `<div class="pagina">
    ${vIntro()}
    <div class="palco">
      <div class="ficha" role="region" aria-label="Ficha de ${esc(S.name)}">
        <div class="janela-barra"><span class="cz">ICARUS RPG · ${esc(S.name.toUpperCase())}</span><nav aria-label="Botões da janela do Foundry"><span>Ficha</span><span>Token</span><span>Fechar</span></nav></div>
        ${vCabecalho(D)}${vRecursos(D)}${vAbas()}
        <div class="corpo" id="corpo" role="tabpanel" aria-labelledby="aba-${ui.aba}">${corpo}</div>
        ${vRodape()}
      </div>
      ${vChat(D)}
    </div>
  </div>${vModal()}`;
  if (window.morphdom){
    morphdom(app, `<div id="app">${html}</div>`, {
      onBeforeElUpdated(de, para){
        if (de.isEqualNode(para)) return false;
        // Não sobrescreve o que a pessoa está digitando num texto livre
        if (de === document.activeElement && de.tagName === "TEXTAREA") return false;
        return true;
      }
    });
  } else {
    const foco = document.activeElement && document.activeElement.id;
    app.innerHTML = html;
    if (foco) { const el = document.getElementById(foco); if (el) el.focus({preventScroll:true}); }
  }
}
let pendente = false;
function agendar(){ if (pendente) return; pendente = true; requestAnimationFrame(() => { pendente = false; render(); }); }

/* ---------- Ações ---------- */
function rolar(k){
  const D = derivar(S), p = PER[k], mod = D.per[k].total;
  const d = 1 + (crypto.getRandomValues(new Uint32Array(1))[0] % 20);
  const r = {rotulo:p.nome, d, mod, total:d + mod, modo:ui.modo, ator:S.name || "Personagem"};
  ui.ultima = r; ui.chat.push(r); if (ui.chat.length > 50) ui.chat.shift();
  render();
  const log = document.getElementById("chat-log"); if (log) log.scrollTop = log.scrollHeight;
}

function abrirModal(m){ ui.modal = m; render(); const f = document.querySelector(".dlg input, .dlg select, .dlg button"); if (f) f.focus(); }
function fecharModal(){ ui.modal = null; render(); }

function verificar(){
  const T = dadosTeste(), D = derivar(T);
  const ok = (nome, obtido, esperado) => ({nome, obtido:String(obtido), ok:obtido === esperado});
  const tot = ATR.map(k => k + " " + fmt(D.A[k])).join(" ");
  const res = [
    ok("Atributos FOR +4 DES +1 CON +2 INT +0 SAB +1 CAR +2", tot, "FOR +4 DES +1 CON +2 INT +0 SAB +1 CAR +2"),
    ok("PV máx 42 (16 + 4×4 + 2×5)", D.pvMax, 42),
    ok("PM máx 20", D.pmMax, 20),
    ok("Defesa 19 (10 + 1 + 5 + 2 + 1)", D.def, 19),
    ok("Luta Treinado +6", fmt(D.per.luta.total), "+6"),
    ok("Cavalgar Especialista +5", fmt(D.per.cavalgar.total), "+5"),
    ok("Fortitude Treinado +4", fmt(D.per.fortitude.total), "+4"),
    ok("Iniciativa Treinado +3", fmt(D.per.iniciativa.total), "+3")
  ];
  const T2 = dadosTeste(); T2.nivel = 21; T2.pv.value = 999;
  const D2 = derivar(T2);
  res.push(ok("Nível 21 ativa PARAGON", D2.paragon, true));
  res.push(ok("PV atual limitado ao máximo (nível 21: 16 + 4×20 + 2×21 = 138)", D2.pv, 138));
  const T3 = dadosTeste(); T3.efeitos[0].disabled = false;
  res.push(ok("Efeito Sinal de Carga ligado: Defesa 21", derivar(T3).def, 21));
  const T4 = dadosTeste(); T4.classeConfig.manual = true; T4.pv.max = 50; T4.classeConfig.bonusPv = 3;
  res.push(ok("Modo manual PV 50 + bônus 3 = 53", derivar(T4).pvMax, 53));
  ui.testes = res; render();
}

app.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "fundo-modal"){ if (ev.target === el) fecharModal(); return; }
  const D = derivar(S);
  switch (a){
    case "aba": ui.aba = el.dataset.aba; render(); document.getElementById("corpo").scrollTop = 0; return;
    case "nivel": S.nivel = clamp(D.n + Number(el.dataset.delta), 1, 25); break;
    case "recurso": {
      const k = el.dataset.rec, max = k === "pv" ? D.pvMax : D.pmMax, atual = k === "pv" ? D.pv : D.pm;
      S[k].value = clamp(atual + Number(el.dataset.delta), 0, max); break;
    }
    case "treino": { const p = S.pericias[el.dataset.k]; p.treino = ((p.treino || 0) + 1) % 3; break; }
    case "rolar": rolar(el.dataset.k); return;
    case "retrato": document.getElementById("arquivo-retrato").click(); return;
    case "verificar": verificar(); return;
    case "restaurar": S = dadosTeste(); ui.ultima = null; ui.testes = null; break;
    case "equipar": { const it = S.itens.find(i => i.id === el.dataset.id); it.system.equipado = !it.system.equipado; break; }
    case "alternar-efeito": { const e = S.efeitos.find(i => i.id === el.dataset.id); e.disabled = !e.disabled; break; }
    case "excluir-item": S.itens = S.itens.filter(i => i.id !== el.dataset.id); break;
    case "excluir-efeito": S.efeitos = S.efeitos.filter(i => i.id !== el.dataset.id); break;
    case "editar-item": abrirModal({tipo:"item", d:structuredClone(S.itens.find(i => i.id === el.dataset.id))}); return;
    case "novo-item": abrirModal({tipo:"item", d:{id:null,type:"equipamento",name:"Novo item",system:{tipo:"outro",quantidade:1,equipado:false,bonusDefesa:0,descricao:""}}}); return;
    case "novo-poder": abrirModal({tipo:"item", d:{id:null,type:"poder",name:"Novo poder",system:{fonte:el.dataset.fonte,custoPM:"",prerequisito:"",nivel:"",descricao:""}}}); return;
    case "editar-efeito": { const e = structuredClone(S.efeitos.find(i => i.id === el.dataset.id)); e.ativo = !e.disabled; abrirModal({tipo:"efeito", d:e}); return; }
    case "novo-efeito": abrirModal({tipo:"efeito", d:{id:null,name:"Novo efeito",descricao:"",ativo:true,changes:[{key:"system.defesa.outros",value:1}]}}); return;
    case "abrir-nivel": abrirModal({tipo:"nivel", d:{cc:structuredClone(S.classeConfig), pvMax:S.classeConfig.manual ? num(S.pv.max) : D.pvForm, pmMax:S.classeConfig.manual ? num(S.pm.max) : D.pmForm}}); return;
    case "passo": { const cc = ui.modal.d.cc, c = el.dataset.campo; cc[c] = Math.max(0, num(cc[c]) + Number(el.dataset.delta)); break; }
    case "chip": { const cc = ui.modal.d.cc; cc[el.dataset.campo] = el.dataset.valor || null; break; }
    case "add-mudanca": ui.modal.d.changes.push({key:"system.defesa.outros",value:1}); break;
    case "remover-mudanca": ui.modal.d.changes.splice(Number(el.dataset.i), 1); break;
    case "fechar-modal": fecharModal(); return;
    case "salvar-modal": salvarModal(); return;
  }
  render();
});

function salvarModal(){
  const m = ui.modal, d = m.d;
  if (m.tipo === "nivel"){
    S.classeConfig = d.cc;
    if (d.cc.manual){ S.pv.max = num(d.pvMax); S.pm.max = num(d.pmMax); }
  } else if (m.tipo === "item"){
    if (!d.name.trim()) d.name = d.type === "poder" ? "Poder sem nome" : "Item sem nome";
    if (d.id){ S.itens = S.itens.map(i => (i.id === d.id ? d : i)); }
    else { d.id = novoId(d.type === "poder" ? "p" : "e"); S.itens.push(d); }
  } else if (m.tipo === "efeito"){
    const ef = {id:d.id || novoId("f"), name:d.name.trim() || "Efeito sem nome", descricao:d.descricao, disabled:!d.ativo, changes:d.changes};
    if (d.id) S.efeitos = S.efeitos.map(e => (e.id === d.id ? ef : e)); else S.efeitos.push(ef);
  }
  fecharModal();
}

function lerValor(el){
  const t = el.dataset.type;
  if (t === "bool") return el.checked;
  if (t === "float"){ const n = parseFloat(el.value); return Number.isFinite(n) ? n : 0; }
  if (t === "number"){ const n = parseInt(el.value, 10); return Number.isFinite(n) ? n : 0; }
  if (t === "vazio"){ if (el.value.trim() === "") return ""; const n = parseInt(el.value, 10); return Number.isFinite(n) ? n : ""; }
  return el.value;
}

app.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.field){
    const v = lerValor(el);
    if (el.dataset.field === "nivel") S.nivel = clamp(v,1,25);
    else setPath(S, el.dataset.field, v);
    if (el.dataset.field === "pv.value" || el.dataset.field === "pm.value"){
      const D = derivar(S), k = el.dataset.field.slice(0,2);
      S[k].value = clamp(num(S[k].value), 0, k === "pv" ? D.pvMax : D.pmMax);
    }
    agendar();
  } else if (el.dataset.draft && ui.modal){
    setPath(ui.modal.d, el.dataset.draft, lerValor(el)); agendar();
  } else if (el.dataset.ui){
    ui[el.dataset.ui] = el.value; agendar();
  }
});
app.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.live) S[el.dataset.live] = el.value;
  else if (el.dataset.draft && ui.modal && el.tagName === "TEXTAREA") setPath(ui.modal.d, el.dataset.draft, el.value);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.modal){ ev.preventDefault(); fecharModal(); }
});
document.getElementById("arquivo-retrato").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const leitor = new FileReader();
  leitor.onload = () => { S.img = leitor.result; render(); };
  leitor.readAsDataURL(f); ev.target.value = "";
});

render();
</script>
