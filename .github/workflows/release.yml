# Ao enviar uma tag vX.Y.Z, monta icarus-rpg.zip e publica o release com o system.json.
# O Foundry instala e atualiza pelo manifest: releases/latest/download/system.json
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão da tag com o system.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSAO=$(jq -r .version system.json)
          if [ "$TAG" != "$VERSAO" ]; then
            echo "A tag v$TAG não bate com a versão $VERSAO do system.json"; exit 1
          fi
          grep -q "releases/download/v$VERSAO/icarus-rpg.zip" system.json || { echo "O link download do system.json não aponta para v$VERSAO"; exit 1; }

      - name: Testar fórmulas
        run: node --test tests/regras.test.mjs

      - name: Montar o pacote
        run: zip -r icarus-rpg.zip system.json icarus.mjs module templates styles fonts lang img README.md -x "*.DS_Store" "img/Logo oficial/*" "img/Wallpaper Icarus System.png"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" icarus-rpg.zip system.json --title "Icarus RPG $GITHUB_REF_NAME" --generate-notes
